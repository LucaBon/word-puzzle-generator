<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Search Puzzle</title>
    <style>
        :root {
            --cell-size: 35px;
            --font-size: 16px;
            --grid-gap: 2px;
            --border-radius: 5px;
            --grid-cols: 20;
            --word-item-padding: 10px 14px;
            --word-item-font-size: 1em;
            --word-gap: 8px;
            --words-section-width: 380px;
            --words-list-columns: 2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1300px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: clamp(1.5em, 3vw, 2.5em);
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 24px;
            font-size: clamp(0.9em, 2vw, 1.1em);
        }

        /* Customize panel */
        .settings {
            background: #f8f9fa;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .settings summary {
            cursor: pointer;
            padding: 16px 20px;
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
            list-style: none;
        }

        .settings summary::-webkit-details-marker { display: none; }
        .settings summary::before { content: '▸ '; color: #764ba2; }
        .settings[open] summary::before { content: '▾ '; }

        .settings-body {
            display: grid;
            grid-template-columns: 260px 1fr auto;
            gap: 20px;
            align-items: end;
            padding: 0 20px 20px;
        }

        .field label {
            display: block;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }

        .field .hint { font-weight: normal; color: #888; font-size: 0.9em; }

        .field-stack { display: grid; gap: 16px; }

        select {
            width: 100%;
            padding: 6px 10px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            background: white;
            font: inherit;
            font-size: 0.95em;
        }

        select:focus { outline: none; border-color: #764ba2; }

        .size-row { display: flex; align-items: center; gap: 12px; }
        .size-row input[type=range] { flex: 1; accent-color: #764ba2; }
        .size-value {
            min-width: 64px;
            text-align: center;
            font-weight: bold;
            color: #764ba2;
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 4px 8px;
        }

        textarea {
            width: 100%;
            min-height: 90px;
            resize: vertical;
            padding: 10px 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font: inherit;
            font-size: 0.95em;
            text-transform: uppercase;
        }

        textarea:focus { outline: none; border-color: #764ba2; }

        .link-btn {
            background: none;
            box-shadow: none;
            color: #764ba2;
            padding: 6px 0 0;
            font-size: 0.95em;
        }

        .link-btn:hover { transform: none; box-shadow: none; text-decoration: underline; }

        .settings-error {
            grid-column: 1 / -1;
            color: #c62828;
            background: #ffebee;
            border-radius: 8px;
            padding: 10px 14px;
            display: none;
        }

        .settings-error.show { display: block; }

        .game-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .grid-section {
            flex: 1;
            min-width: min(400px, 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .grid-container {
            display: inline-block;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            user-select: none;
            max-width: 100%;
            overflow: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(var(--grid-cols), var(--cell-size));
            gap: var(--grid-gap);
            touch-action: none;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 2px solid #dee2e6;
            border-radius: var(--border-radius);
            font-size: var(--font-size);
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
            position: relative;
        }

        .cell:hover { background: #e3f2fd; transform: scale(1.05); z-index: 10; }
        .cell.selecting { background: #bbdefb !important; border-color: #2196F3 !important; transform: scale(1.1); z-index: 100; }
        .cell.found { background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; border-color: #4CAF50; }

        .words-section {
            flex: 0 0 var(--words-section-width);
            min-width: 250px;
            max-height: 80vh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .words-section::-webkit-scrollbar { width: 8px; }
        .words-section::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .words-section::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .words-section::-webkit-scrollbar-thumb:hover { background: #555; }

        .words-title {
            font-size: clamp(1.3em, 2vw, 1.8em);
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
            position: sticky;
            top: 0;
            background: white;
            padding: 10px 0;
            z-index: 10;
        }

        .words-list {
            display: grid;
            grid-template-columns: repeat(var(--words-list-columns), 1fr);
            gap: var(--word-gap);
            padding-right: 5px;
        }

        .word-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: var(--word-item-padding);
            border-radius: 10px;
            font-weight: bold;
            font-size: var(--word-item-font-size);
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            cursor: default;
            text-align: center;
            word-break: break-word;
        }

        .word-item:hover { transform: translateX(5px); }
        .word-item.found { background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); text-decoration: line-through; opacity: 0.7; }

        .stats {
            margin-top: 30px;
            padding: 20px;
            background: #e3f2fd;
            border-radius: 12px;
            text-align: center;
        }

        .stats h3 { color: #333; margin-bottom: 10px; }
        .progress { font-size: 1.5em; color: #2196F3; font-weight: bold; }

        .controls { margin-top: 20px; text-align: center; }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.3); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .victory {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            text-align: center;
            z-index: 1000;
            animation: popIn 0.5s ease;
            width: min(90vw, 480px);
        }

        .victory.show { display: block; }
        .victory h2 { color: #4CAF50; font-size: 2.2em; margin-bottom: 20px; }
        .victory p { font-size: 1.2em; color: #666; }

        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        .overlay.show { display: block; }

        .footer { margin-top: 30px; text-align: center; color: #888; font-size: 0.9em; }
        .footer a { color: #764ba2; }

        @media screen and (max-width: 900px) {
            .settings-body { grid-template-columns: 1fr; }
            .settings-body button { width: 100%; }
        }

        @media screen and (max-width: 768px) {
            body { padding: 16px; }
            .container { padding: 20px 16px; }
            .game-container { gap: 20px; }
            .grid-section { min-width: 100%; }
            .grid-container { padding: 8px; }
            .cell { border-width: 1px; }
            .words-section { flex: 0 0 100%; width: 100%; max-height: none; }
            .words-list { grid-template-columns: 1fr 1fr !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Word Search Puzzle</h1>
        <div class="subtitle">Click and drag to select words! Pick your own words, grid size and language below.</div>

        <details class="settings" open>
            <summary>⚙️ Customize puzzle</summary>
            <form class="settings-body" id="settingsForm">
                <div class="field-stack">
                    <div class="field">
                        <label for="sizeInput">Grid size</label>
                        <div class="size-row">
                            <input type="range" id="sizeInput" min="5" max="30" value="20">
                            <span class="size-value" id="sizeValue">20×20</span>
                        </div>
                    </div>
                    <div class="field">
                        <label for="langInput">Word language</label>
                        <select id="langInput">
                            <option value="en">🇬🇧 English</option>
                            <option value="it">🇮🇹 Italiano</option>
                            <option value="es">🇪🇸 Español</option>
                            <option value="fr">🇫🇷 Français</option>
                            <option value="de">🇩🇪 Deutsch</option>
                        </select>
                    </div>
                </div>
                <div class="field">
                    <label for="wordsInput">Words <span class="hint">(comma, space or one per line — up to 40)</span></label>
                    <textarea id="wordsInput" spellcheck="false"></textarea>
                    <button type="button" class="link-btn" id="randomBtn">🔀 Random words for this size</button>
                </div>
                <button type="submit" id="generateBtn">✨ Generate</button>
                <div class="settings-error" id="settingsError" role="alert"></div>
            </form>
        </details>

        <div class="game-container">
            <div class="grid-section">
                <div class="grid-container">
                    <div class="grid" id="grid"></div>
                </div>
                <div class="controls">
                    <button onclick="newPuzzle()">🎲 New Puzzle</button>
                </div>
            </div>
            <div class="words-section">
                <div class="words-title">Words to Find:</div>
                <div class="words-list" id="wordsList"></div>
                <div class="stats">
                    <h3>Progress</h3>
                    <div class="progress">
                        <span id="found">0</span> / <span id="total">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            Made with <a href="https://github.com/LucaBon/word-puzzle-generator">word-puzzle-generator</a>
        </div>
    </div>
    <div class="overlay" id="overlay"></div>
    <div class="victory" id="victory">
        <h2>🎉 Congratulations! 🎉</h2>
        <p>You found all the words!</p>
        <br>
        <button onclick="newPuzzle()">🎲 New Puzzle</button>
    </div>
    <script>
        // ---------- Generator (port of word_puzzle/application/services.py) ----------

        const MIN_SIZE = 5, MAX_SIZE = 30, MAX_WORDS = 40;
        const DEFAULT_WORDS = ['ALGORITHM', 'NETWORK', 'NEURON', 'MACHINELEARNING', 'MODEL', 'DATA',
            'TRAINING', 'INTELLIGENCE', 'ARTIFICIAL', 'AUTOMATION', 'PREDICTION', 'LANGUAGE',
            'VISION', 'ROBOT', 'CLASSIFICATION', 'DEEP', 'RECOGNITION', 'TOKEN', 'GENERATIVE', 'RANDOMFOREST'];

        // Word banks used to pick a list that suits the chosen grid size.
        // Words are written without accents (German umlauts as AE/OE/UE) so they
        // blend in with the A–Z filler letters.
        const DEFAULT_LANG = 'en';
        const WORD_BANKS = {
            it: ['BIT', 'GPU', 'BYTE', 'CHIP', 'DATI', 'RETE', 'DEEP', 'BIAS', 'NODO', 'PESO',
                'TOKEN', 'ROBOT', 'PIXEL', 'CLOUD', 'CODICE', 'STRATO', 'LOGICA', 'AGENTE', 'PROMPT', 'SEGNALE',
                'VETTORE', 'TENSORE', 'MODELLO', 'NEURONI', 'DATASET', 'CHATBOT', 'MEMORIA', 'SENSORE', 'CALCOLO',
                'VISIONE', 'ROBOTICA', 'FUNZIONE', 'ALGORITMO', 'GRADIENTE', 'EMBEDDING', 'INFERENZA', 'PARAMETRI',
                'ATTENZIONE', 'LINGUAGGIO', 'PREDIZIONE', 'GENERATIVO', 'AUTOMAZIONE', 'ARTIFICIALE', 'RETINEURALI',
                'INTELLIGENZA', 'RANDOMFOREST', 'DEEPLEARNING', 'ADDESTRAMENTO', 'APPRENDIMENTO', 'TRASFORMATORE',
                'RICONOSCIMENTO', 'OTTIMIZZAZIONE', 'CLASSIFICAZIONE', 'MACHINELEARNING', 'BACKPROPAGATION'],
            en: ['BIT', 'GPU', 'BYTE', 'CHIP', 'DATA', 'NODE', 'BIAS', 'LOSS', 'CODE', 'TOKEN',
                'ROBOT', 'PIXEL', 'CLOUD', 'LAYER', 'MODEL', 'AGENT', 'LOGIC', 'PROMPT', 'NEURON', 'SIGNAL',
                'VECTOR', 'TENSOR', 'MEMORY', 'SENSOR', 'WEIGHT', 'VISION', 'DATASET', 'CHATBOT', 'NETWORK',
                'ROBOTICS', 'FUNCTION', 'TRAINING', 'LANGUAGE', 'ALGORITHM', 'GRADIENT', 'EMBEDDING', 'INFERENCE',
                'PARAMETER', 'ATTENTION', 'PREDICTION', 'GENERATIVE', 'AUTOMATION', 'ARTIFICIAL', 'TRANSFORMER',
                'RECOGNITION', 'INTELLIGENCE', 'RANDOMFOREST', 'DEEPLEARNING', 'OPTIMIZATION', 'NEURALNETWORK',
                'REINFORCEMENT', 'COMPUTERVISION', 'CLASSIFICATION', 'MACHINELEARNING', 'BACKPROPAGATION'],
            es: ['BIT', 'GPU', 'RED', 'BYTE', 'CHIP', 'NODO', 'PESO', 'NUBE', 'CAPA', 'DATOS',
                'SESGO', 'TOKEN', 'ROBOT', 'PIXEL', 'CODIGO', 'LOGICA', 'AGENTE', 'MODELO', 'PROMPT', 'VECTOR',
                'TENSOR', 'SENSOR', 'VISION', 'NEURONA', 'MEMORIA', 'CALCULO', 'DATASET', 'CHATBOT', 'ROBOTICA',
                'FUNCION', 'LENGUAJE', 'ATENCION', 'ALGORITMO', 'GRADIENTE', 'EMBEDDING', 'INFERENCIA', 'PARAMETROS',
                'GENERATIVO', 'ARTIFICIAL', 'PREDICCION', 'APRENDIZAJE', 'INTELIGENCIA', 'OPTIMIZACION',
                'TRANSFORMADOR', 'ENTRENAMIENTO', 'CLASIFICACION', 'AUTOMATIZACION', 'RECONOCIMIENTO',
                'BOSQUEALEATORIO', 'REDESNEURONALES'],
            fr: ['BIT', 'GPU', 'CODE', 'PUCE', 'OCTET', 'NOEUD', 'POIDS', 'BIAIS', 'TOKEN', 'ROBOT',
                'PIXEL', 'NUAGE', 'AGENT', 'COUCHE', 'MODELE', 'PROMPT', 'SIGNAL', 'CALCUL', 'VISION', 'LOGIQUE',
                'NEURONE', 'VECTEUR', 'TENSEUR', 'MEMOIRE', 'CAPTEUR', 'DONNEES', 'RESEAU', 'CHATBOT', 'LANGAGE',
                'FONCTION', 'GRADIENT', 'ROBOTIQUE', 'INFERENCE', 'PARAMETRE', 'ATTENTION', 'GENERATIF',
                'ALGORITHME', 'PLONGEMENT', 'PREDICTION', 'TRANSFORMEUR', 'ARTIFICIELLE', 'INTELLIGENCE',
                'ENTRAINEMENT', 'OPTIMISATION', 'APPRENTISSAGE', 'JEUDEDONNEES', 'FORETALEATOIRE', 'RESEAUNEURONAL',
                'RECONNAISSANCE', 'AUTOMATISATION', 'CLASSIFICATION'],
            de: ['BIT', 'GPU', 'BYTE', 'CHIP', 'NETZ', 'BIAS', 'CODE', 'DATEN', 'TOKEN', 'PIXEL',
                'CLOUD', 'LOGIK', 'AGENT', 'KNOTEN', 'MODELL', 'PROMPT', 'NEURON', 'SIGNAL', 'VEKTOR', 'TENSOR',
                'SENSOR', 'LERNEN', 'ROBOTER', 'GEWICHT', 'SCHICHT', 'CHATBOT', 'ROBOTIK', 'SPRACHE', 'SPEICHER',
                'FUNKTION', 'GRADIENT', 'INFERENZ', 'TRAINING', 'DATENSATZ', 'PARAMETER', 'EMBEDDING', 'GENERATIV',
                'ERKENNUNG', 'KUENSTLICH', 'VORHERSAGE', 'TRANSFORMER', 'ALGORITHMUS', 'INTELLIGENZ', 'OPTIMIERUNG',
                'ZUFALLSWALD', 'DEEPLEARNING', 'KLASSIFIKATION', 'AUFMERKSAMKEIT', 'NEURONALESNETZ',
                'AUTOMATISIERUNG', 'MASCHINELLESLERNEN']
        };

        function wordCountFor(size) {
            if (size <= 6) return 4;
            if (size <= 8) return 6;
            return Math.min(MAX_WORDS, Math.round(size * 0.8));
        }

        function pickWords(size, count, lang) {
            const minLength = size >= 15 ? 4 : 3;
            const eligible = WORD_BANKS[lang].filter(w => w.length <= size && w.length >= minLength);
            return shuffle([...eligible]).slice(0, count);
        }

        // Pick words for the size, trying a fresh (and eventually smaller) sample if they don't fit
        function generateRandomPuzzle(size, lang) {
            const target = wordCountFor(size);
            for (let attempt = 0; attempt < 9; attempt++) {
                const words = pickWords(size, Math.max(1, target - Math.floor(attempt / 3)), lang);
                const puzzle = generatePuzzle(size, words, 300, 600);
                if (puzzle) return { words, puzzle };
            }
            return null;
        }

        const HORIZONTAL = [[0, 1], [0, -1]];
        const VERTICAL = [[1, 0], [-1, 0]];
        const DIAGONAL = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
        const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function directionType([dr, dc]) {
            if (dr === 0) return 'horizontal';
            if (dc === 0) return 'vertical';
            return 'diagonal';
        }

        function priorityDirections(counts, total, index) {
            const target = Math.floor(total / 3);
            if (counts.diagonal < target) return [...DIAGONAL, ...HORIZONTAL, ...VERTICAL];
            if (counts.horizontal < target) return [...HORIZONTAL, ...DIAGONAL, ...VERTICAL];
            if (counts.vertical < target) return [...VERTICAL, ...DIAGONAL, ...HORIZONTAL];
            const groups = [HORIZONTAL, VERTICAL, DIAGONAL];
            const selected = index % groups.length;
            return [...groups[selected], ...groups.filter((_, i) => i !== selected).flat()];
        }

        function canPlace(grid, size, word, row, col, [dr, dc]) {
            for (let i = 0; i < word.length; i++) {
                const r = row + i * dr, c = col + i * dc;
                if (r < 0 || r >= size || c < 0 || c >= size) return false;
                if (grid[r][c] !== '' && grid[r][c] !== word[i]) return false;
            }
            return true;
        }

        function tryPlaceWord(grid, size, word, directions) {
            const positions = [];
            for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) positions.push([r, c]);
            for (const dir of shuffle(directions)) {
                for (const [row, col] of shuffle(positions)) {
                    if (canPlace(grid, size, word, row, col, dir)) {
                        const cells = [];
                        for (let i = 0; i < word.length; i++) {
                            const r = row + i * dir[0], c = col + i * dir[1];
                            grid[r][c] = word[i];
                            cells.push([r, c]);
                        }
                        return { dir, cells };
                    }
                }
            }
            return null;
        }

        function attemptPlacement(size, words) {
            const grid = Array.from({ length: size }, () => Array(size).fill(''));
            const placements = {};
            const counts = { horizontal: 0, vertical: 0, diagonal: 0 };
            for (let i = 0; i < words.length; i++) {
                const placed = tryPlaceWord(grid, size, words[i], priorityDirections(counts, words.length, i));
                if (!placed) return null;
                counts[directionType(placed.dir)]++;
                placements[words[i]] = placed.cells;
            }
            if (counts.diagonal < words.length * 0.2) return null;
            return { grid, words: placements };
        }

        function generatePuzzle(size, words, maxAttempts = 1000, timeBudgetMs = 4000) {
            const sorted = [...words].sort((a, b) => b.length - a.length);
            const deadline = performance.now() + timeBudgetMs;
            for (let attempt = 0; attempt < maxAttempts && performance.now() < deadline; attempt++) {
                const result = attemptPlacement(size, shuffle([...sorted]));
                if (result) {
                    for (const row of result.grid)
                        for (let c = 0; c < size; c++)
                            if (row[c] === '') row[c] = LETTERS[Math.floor(Math.random() * LETTERS.length)];
                    return result;
                }
            }
            return null;
        }

        function parseWords(text) {
            const seen = new Set();
            return text.split(/[\s,;]+/)
                .map(w => w.toUpperCase().replace(/[^\p{L}]/gu, ''))
                .filter(w => w && !seen.has(w) && seen.add(w));
        }

        function validate(size, words) {
            if (words.length === 0) return 'Please enter at least one word.';
            if (words.length > MAX_WORDS) return `Too many words (${words.length}). The maximum is ${MAX_WORDS}.`;
            const longest = words.reduce((a, b) => (b.length > a.length ? b : a));
            if (longest.length > size)
                return `"${longest}" (${longest.length} letters) won't fit in a ${size}×${size} grid. ` +
                       `Increase the grid size to at least ${longest.length} or use shorter words.`;
            return null;
        }

        // ---------- Layout ----------

        function gridStyling(size) {
            if (size <= 10) return [50, 22, 3, 8];
            if (size <= 15) return [45, 20, 3, 6];
            if (size <= 20) return [35, 16, 2, 5];
            return [28, 14, 2, 4];
        }

        function wordListStyling(count) {
            if (count <= 10) return ['15px 20px', '1.2em', '12px', '300px', '1'];
            if (count <= 20) return ['12px 16px', '1.1em', '10px', '320px', '1'];
            if (count <= 30) return ['10px 14px', '1em', '8px', '380px', '2'];
            return ['8px 12px', '0.95em', '6px', '450px', '2'];
        }

        function applyLayout() {
            const size = currentSettings.size;
            const root = document.documentElement.style;
            let [cell, font, gap, radius] = gridStyling(size);
            // Shrink cells so the grid fits the available width (e.g. on phones)
            const container = document.querySelector('.grid-container');
            const padding = parseFloat(getComputedStyle(container).paddingLeft) * 2;
            const available = document.querySelector('.grid-section').clientWidth - padding - 4;
            if (Math.floor((available - (size - 1) * gap) / size) < cell) {
                gap = 1;
                const fit = Math.floor((available - (size - 1) * gap) / size);
                font = Math.max(8, Math.round(fit * 0.5));
                cell = Math.max(10, fit);
            }
            root.setProperty('--grid-cols', size);
            root.setProperty('--cell-size', cell + 'px');
            root.setProperty('--font-size', font + 'px');
            root.setProperty('--grid-gap', gap + 'px');
            root.setProperty('--border-radius', radius + 'px');

            const [pad, fontSize, wgap, width, cols] = wordListStyling(currentSettings.words.length);
            root.setProperty('--word-item-padding', pad);
            root.setProperty('--word-item-font-size', fontSize);
            root.setProperty('--word-gap', wgap);
            root.setProperty('--words-section-width', width);
            root.setProperty('--words-list-columns', cols);
        }

        // ---------- Game ----------

        const grid = document.getElementById('grid');
        const wordsListEl = document.getElementById('wordsList');
        const sizeInput = document.getElementById('sizeInput');
        const sizeValue = document.getElementById('sizeValue');
        const wordsInput = document.getElementById('wordsInput');
        const langInput = document.getElementById('langInput');
        const settingsError = document.getElementById('settingsError');
        const generateBtn = document.getElementById('generateBtn');

        let currentSettings = { size: 20, words: DEFAULT_WORDS, lang: DEFAULT_LANG };
        let wordData = {};
        let cellsArray = [];
        let isSelecting = false;
        let selectedCells = [];
        let foundWords = new Set();
        let selectionDirection = null;
        let startCell = null;

        function cellAt(row, col) {
            const size = currentSettings.size;
            if (row < 0 || row >= size || col < 0 || col >= size) return null;
            return cellsArray[row * size + col];
        }

        function render(puzzle) {
            const size = currentSettings.size;
            wordData = puzzle.words;
            foundWords.clear();
            selectedCells = [];

            grid.innerHTML = '';
            cellsArray = [];
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.textContent = puzzle.grid[r][c];
                    grid.appendChild(cell);
                    cellsArray.push(cell);
                }
            }

            wordsListEl.innerHTML = '';
            for (const word of Object.keys(wordData).sort()) {
                const item = document.createElement('div');
                item.className = 'word-item';
                item.dataset.word = word;
                item.textContent = word;
                wordsListEl.appendChild(item);
            }

            applyLayout();
            document.getElementById('total').textContent = Object.keys(wordData).length;
            updateProgress();
        }

        function showError(message) {
            settingsError.textContent = message || '';
            settingsError.classList.toggle('show', !!message);
        }

        function runGenerator(task) {
            showError('');
            generateBtn.disabled = true;
            generateBtn.textContent = '⏳ Generating…';
            // Let the browser paint the button state before the synchronous search
            setTimeout(() => {
                const result = task();
                generateBtn.disabled = false;
                generateBtn.textContent = '✨ Generate';
                if (typeof result === 'string') { showError(result); return; }
                currentSettings = result.settings;
                syncForm(result.settings);
                render(result.puzzle);
                saveToUrl(result.settings);
            }, 20);
        }

        function generate(settings) {
            const error = validate(settings.size, settings.words);
            if (error) { showError(error); return; }
            runGenerator(() => {
                const puzzle = generatePuzzle(settings.size, settings.words);
                if (!puzzle)
                    return `Couldn't fit all ${settings.words.length} words in a ${settings.size}×${settings.size} grid. ` +
                           'Try a bigger grid or fewer words.';
                return { settings: { ...settings, lang: settings.lang || langInput.value }, puzzle };
            });
        }

        function generateRandom(size, lang) {
            runGenerator(() => {
                const result = generateRandomPuzzle(size, lang);
                if (!result) return `Couldn't build a ${size}×${size} puzzle. Please try again.`;
                return { settings: { size, lang, words: result.words }, puzzle: result.puzzle };
            });
        }

        function newPuzzle() {
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('victory').classList.remove('show');
            generate(currentSettings);
        }

        // Settings are kept in the URL so a custom puzzle can be shared
        function saveToUrl({ size, lang, words }) {
            const params = new URLSearchParams({ size, lang, words: words.join(',') });
            history.replaceState(null, '', '?' + params.toString());
        }

        function loadFromUrl() {
            const params = new URLSearchParams(location.search);
            const size = parseInt(params.get('size'), 10);
            const words = params.has('words') ? parseWords(params.get('words')) : [];
            const lang = params.get('lang');
            return {
                size: size >= MIN_SIZE && size <= MAX_SIZE ? size : 20,
                lang: WORD_BANKS.hasOwnProperty(lang) ? lang : DEFAULT_LANG,
                words
            };
        }

        function syncForm({ size, lang, words }) {
            sizeInput.value = size;
            langInput.value = lang;
            sizeValue.textContent = `${size}×${size}`;
            wordsInput.value = words.join(', ');
        }

        sizeInput.addEventListener('input', () => {
            sizeValue.textContent = `${sizeInput.value}×${sizeInput.value}`;
        });

        // Changing the size or language picks a new word list that fits the grid
        const generateRandomFromForm = () => generateRandom(parseInt(sizeInput.value, 10), langInput.value);
        sizeInput.addEventListener('change', generateRandomFromForm);
        langInput.addEventListener('change', generateRandomFromForm);
        document.getElementById('randomBtn').addEventListener('click', generateRandomFromForm);

        document.getElementById('settingsForm').addEventListener('submit', e => {
            e.preventDefault();
            generate({ size: parseInt(sizeInput.value, 10), lang: langInput.value, words: parseWords(wordsInput.value) });
        });

        wordsInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) document.getElementById('settingsForm').requestSubmit();
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(applyLayout, 100);
        });

        // ---------- Selection ----------

        grid.addEventListener('mousedown', startSelection);
        grid.addEventListener('mouseover', continueSelection);
        document.addEventListener('mouseup', endSelection);
        grid.addEventListener('touchstart', handleTouchStart, { passive: false });
        grid.addEventListener('touchmove', handleTouchMove, { passive: false });
        grid.addEventListener('touchend', endSelection);

        function beginAt(cell) {
            isSelecting = true;
            selectedCells = [];
            selectionDirection = null;
            startCell = cell;
            clearSelection();
            selectCell(cell);
        }

        function startSelection(e) {
            if (e.target.classList.contains('cell')) {
                e.preventDefault();
                beginAt(e.target);
            }
        }

        function continueSelection(e) {
            if (isSelecting && e.target.classList.contains('cell')) selectCell(e.target);
        }

        function rc(cell) { return [parseInt(cell.dataset.row), parseInt(cell.dataset.col)]; }

        function getDirection(fromCell, toCell) {
            const [fr, fc] = rc(fromCell), [tr, tc] = rc(toCell);
            return { rowDir: Math.sign(tr - fr), colDir: Math.sign(tc - fc) };
        }

        function isInLine(fromCell, toCell, direction) {
            const [fr, fc] = rc(fromCell), [tr, tc] = rc(toCell);
            const rowDiff = tr - fr, colDiff = tc - fc;
            if (direction.rowDir === 0) return rowDiff === 0 && Math.sign(colDiff) === direction.colDir;
            if (direction.colDir === 0) return colDiff === 0 && Math.sign(rowDiff) === direction.rowDir;
            return Math.abs(rowDiff) === Math.abs(colDiff) &&
                   Math.sign(rowDiff) === direction.rowDir && Math.sign(colDiff) === direction.colDir;
        }

        function addSelected(cell) {
            if (!selectedCells.includes(cell)) {
                selectedCells.push(cell);
                cell.classList.add('selecting');
            }
        }

        function selectCell(cell) {
            if (selectedCells.includes(cell)) return;
            if (selectedCells.length === 0) { addSelected(cell); return; }
            if (selectedCells.length === 1) {
                const dir = getDirection(selectedCells[0], cell);
                if (isInLine(selectedCells[0], cell, dir)) {
                    selectionDirection = dir;
                    getCellsBetween(selectedCells[0], cell, dir).forEach(addSelected);
                    addSelected(cell);
                }
                return;
            }
            if (selectionDirection && isInLine(startCell, cell, selectionDirection)) {
                const lastCell = selectedCells[selectedCells.length - 1];
                getCellsBetween(lastCell, cell, selectionDirection).forEach(addSelected);
                addSelected(cell);
            }
        }

        function getCellsBetween(fromCell, toCell, direction) {
            const cells = [];
            const [tr, tc] = rc(toCell);
            let [r, c] = rc(fromCell);
            r += direction.rowDir;
            c += direction.colDir;
            while ((r !== tr || c !== tc) && cellAt(r, c)) {
                cells.push(cellAt(r, c));
                r += direction.rowDir;
                c += direction.colDir;
            }
            return cells;
        }

        function endSelection() {
            if (isSelecting) {
                isSelecting = false;
                checkWord();
                clearSelection();
            }
        }

        function clearSelection() { cellsArray.forEach(cell => cell.classList.remove('selecting')); }

        function checkWord() {
            if (selectedCells.length === 0) return;
            const selectedWord = selectedCells.map(cell => cell.textContent).join('');
            const reversedWord = [...selectedWord].reverse().join('');
            for (const [word, positions] of Object.entries(wordData)) {
                if (foundWords.has(word)) continue;
                if ((selectedWord === word && matchesPositions(selectedCells, positions)) ||
                    (reversedWord === word && matchesPositions(selectedCells.slice().reverse(), positions))) {
                    markWordFound(word, selectedCells);
                    return;
                }
            }
        }

        function matchesPositions(cells, positions) {
            if (cells.length !== positions.length) return false;
            return cells.every((cell, i) => {
                const [r, c] = rc(cell);
                return r === positions[i][0] && c === positions[i][1];
            });
        }

        function markWordFound(word, cells) {
            foundWords.add(word);
            cells.forEach(cell => {
                cell.classList.remove('selecting');
                cell.classList.add('found');
            });
            const wordItem = wordsListEl.querySelector(`.word-item[data-word="${CSS.escape(word)}"]`);
            if (wordItem) wordItem.classList.add('found');
            updateProgress();
            if (foundWords.size === Object.keys(wordData).length) setTimeout(showVictory, 500);
        }

        function updateProgress() { document.getElementById('found').textContent = foundWords.size; }

        function showVictory() {
            document.getElementById('overlay').classList.add('show');
            document.getElementById('victory').classList.add('show');
        }

        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            if (element && element.classList.contains('cell')) beginAt(element);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (isSelecting) {
                const touch = e.touches[0];
                const element = document.elementFromPoint(touch.clientX, touch.clientY);
                if (element && element.classList.contains('cell')) selectCell(element);
            }
        }

        // ---------- Start ----------

        // Shared links keep their words; otherwise the English default list is shown,
        // or a random list when another language was requested
        const initial = loadFromUrl();
        syncForm({ ...initial, words: initial.words.length ? initial.words : DEFAULT_WORDS });
        if (initial.words.length) generate(initial);
        else if (initial.lang === DEFAULT_LANG) generate({ ...initial, words: DEFAULT_WORDS });
        else generateRandom(initial.size, initial.lang);
    </script>
</body>
</html>
